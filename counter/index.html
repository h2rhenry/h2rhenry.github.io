<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Đếm thời gian học tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #060B16;
  --bg-2: #0B1424;
  --card: #0F1A2E;
  --border: #1F3150;
  --fg: #E8F0FF;
  --muted: #9DB0CF;
  --primary: #2DD4BF;
  --primary-ink: #04201C;
  --accent: #38BDF8;
  --danger: #F87171;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  font-family: var(--font); color: var(--fg);
  background: radial-gradient(1200px 600px at 50% -10%, #12274A 0%, var(--bg) 60%), var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
main { width: 100%; max-width: 760px; }
.card {
  background: linear-gradient(180deg, var(--card), var(--bg-2));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: clamp(24px, 5vw, 48px);
  text-align: center;
  transition: border-color .25s ease, box-shadow .25s ease;
}
.card.running { border-color: rgba(45,212,191,.55); box-shadow: 0 0 0 4px rgba(45,212,191,.08), 0 0 48px rgba(56,189,248,.12); }
h1 { margin: 0 0 6px; font-size: 1rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.status { margin: 0 0 28px; font-size: .95rem; color: var(--muted); min-height: 1.5em; }
.status b { color: var(--primary); font-weight: 600; }

.clock {
  display: flex; align-items: flex-start; justify-content: center; flex-wrap: wrap;
  gap: clamp(6px, 2vw, 14px);
  font-variant-numeric: tabular-nums;
  min-height: 150px;
}
.unit { display: flex; flex-direction: column; align-items: center; min-width: clamp(76px, 18vw, 132px); animation: pop .35s ease both; }
.unit .num {
  font-size: clamp(3rem, 14vw, 6.5rem); font-weight: 700; line-height: 1.05; letter-spacing: -.02em;
  background: linear-gradient(180deg, #FFFFFF 0%, #8FE9FF 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.unit .lbl { margin-top: 6px; font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sep { font-size: clamp(2.5rem, 11vw, 5rem); font-weight: 300; line-height: 1.15; color: var(--border); align-self: flex-start; }

.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; }
button {
  font: inherit; font-weight: 600; font-size: 1.05rem;
  min-height: 56px; min-width: 156px; padding: 0 28px;
  border-radius: 14px; border: 1px solid transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: background-color .18s ease, border-color .18s ease, transform .12s ease, opacity .18s ease;
}
button svg { width: 20px; height: 20px; flex: none; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.primary { background: var(--primary); color: var(--primary-ink); }
.primary:hover { background: #5EEAD4; }
.primary.pause { background: var(--accent); color: #04202E; }
.primary.pause:hover { background: #7DD3FC; }
.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.ghost:hover { border-color: var(--danger); color: var(--danger); }
.ghost:disabled { opacity: .4; cursor: not-allowed; border-color: var(--border); color: var(--muted); }

.hint { margin: 28px 0 0; font-size: .85rem; color: var(--muted); }

@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .unit { animation: none; }
  button, .card { transition: none; }
}
</style>
</head>
<body>
<main>
  <section class="card" id="card" aria-labelledby="title">
    <h1 id="title">Thời gian học tập</h1>
    <p class="status" id="status" aria-live="polite">Nhấn <b>Bắt đầu</b> để tính giờ</p>

    <div class="clock" id="clock" role="timer" aria-label="Thời gian đã học"></div>

    <div class="actions">
      <button type="button" class="primary" id="toggle">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="icon"><path d="M8 5v14l11-7z"/></svg>
        <span id="toggleText">Bắt đầu</span>
      </button>
      <button type="button" class="ghost" id="reset" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Đặt lại
      </button>
    </div>
    <p class="hint">Phút, giờ và ngày chỉ hiện khi đơn vị nhỏ hơn đã đủ.</p>
  </section>
</main>

<script>
(function () {
  var clock = document.getElementById('clock');
  var card = document.getElementById('card');
  var toggle = document.getElementById('toggle');
  var toggleText = document.getElementById('toggleText');
  var icon = document.getElementById('icon');
  var reset = document.getElementById('reset');
  var statusEl = document.getElementById('status');

  var PLAY = '<path d="M8 5v14l11-7z"/>';
  var PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  var elapsedMs = 0;      // thời gian đã cộng dồn
  var startedAt = null;   // mốc bắt đầu của lượt chạy hiện tại
  var timerId = null;
  var shownCount = -1;    // số đơn vị đang hiển thị, để chỉ dựng lại khi thay đổi

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function totalSeconds() {
    var ms = elapsedMs + (startedAt !== null ? Date.now() - startedAt : 0);
    return Math.floor(ms / 1000);
  }

  function build(count) {
    // count: 1 = giây, 2 = phút+giây, 3 = giờ.., 4 = ngày..
    var names = ['ngày', 'giờ', 'phút', 'giây'];
    var ids = ['d', 'h', 'm', 's'];
    var html = '';
    for (var i = 4 - count; i < 4; i++) {
      if (i > 4 - count) html += '<span class="sep" aria-hidden="true">/</span>';
      html += '<div class="unit"><span class="num" id="u-' + ids[i] + '">00</span><span class="lbl">' + names[i] + '</span></div>';
    }
    clock.innerHTML = html;
    shownCount = count;
  }

  function render() {
    var t = totalSeconds();
    var s = t % 60;
    var m = Math.floor(t / 60) % 60;
    var h = Math.floor(t / 3600) % 24;
    var d = Math.floor(t / 86400);

    var count = d > 0 ? 4 : h > 0 || t >= 3600 ? 3 : t >= 60 ? 2 : 1;
    if (count !== shownCount) build(count);

    var set = function (id, v) { var el = document.getElementById('u-' + id); if (el) el.textContent = pad(v); };
    set('d', d); set('h', h); set('m', m); set('s', s);

    var label = (count >= 4 ? d + ' ngày ' : '') + (count >= 3 ? h + ' giờ ' : '') + (count >= 2 ? m + ' phút ' : '') + s + ' giây';
    clock.setAttribute('aria-label', 'Thời gian đã học: ' + label);
  }

  function setUI(running) {
    card.classList.toggle('running', running);
    toggle.classList.toggle('pause', running);
    toggleText.textContent = running ? 'Tạm dừng' : (elapsedMs > 0 ? 'Tiếp tục' : 'Bắt đầu');
    icon.innerHTML = running ? PAUSE : PLAY;
    reset.disabled = !running && elapsedMs === 0;
    statusEl.innerHTML = running ? 'Đang học, <b>tập trung nào</b>' :
      (elapsedMs > 0 ? 'Đã tạm dừng' : 'Nhấn <b>Bắt đầu</b> để tính giờ');
  }

  function start() {
    startedAt = Date.now();
    timerId = setInterval(render, 250);
    setUI(true);
    render();
  }

  function pause() {
    elapsedMs += Date.now() - startedAt;
    startedAt = null;
    clearInterval(timerId); timerId = null;
    setUI(false);
    render();
  }

  toggle.addEventListener('click', function () { startedAt === null ? start() : pause(); });

  reset.addEventListener('click', function () {
    clearInterval(timerId); timerId = null;
    startedAt = null; elapsedMs = 0;
    setUI(false);
    render();
  });

  setUI(false);
  render();
})();
</script>
</body>
</html>
