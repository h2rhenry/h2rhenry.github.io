<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Tiếng Anh Lớp 10 - Global Success</title>
    <!-- Tích hợp Tailwind CSS để tạo giao diện nhanh và đẹp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp FontAwesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Nền xanh lá nhạt thân thiện */
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Container chính -->
    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[500px]">
        
        <!-- Header -->
        <div class="bg-green-600 text-white p-5 text-center shadow-md relative">
            <button id="home-btn" class="absolute left-5 top-5 hover:text-green-200 hidden transition" title="Về trang chủ">
                <i class="fas fa-home text-xl"></i>
            </button>
            <h1 class="text-2xl font-bold">English Quiz - Grade 10</h1>
            <p class="text-green-100 text-sm mt-1">Global Success (Units 1 - 3)</p>
        </div>

        <!-- MÀN HÌNH 1: CHỌN BÀI TẬP -->
        <div id="screen-selection" class="p-8 flex-grow">
            <h2 class="text-xl font-semibold text-center mb-6">Chọn bài luyện tập</h2>
            <div id="set-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Danh sách các bài sẽ được render bằng JS -->
            </div>
        </div>

        <!-- MÀN HÌNH 2: LÀM BÀI TRẮC NGHIỆM -->
        <div id="screen-quiz" class="p-8 flex-grow hidden flex-col">
            <div class="flex justify-between items-center mb-4 text-sm font-semibold text-gray-500">
                <span id="quiz-title" class="text-green-700">Unit 1: Family Life</span>
                <span id="score-display">Điểm: 0</span>
            </div>
            
            <!-- Thanh tiến trình -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-green-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="text-sm font-bold text-gray-400 mb-2">Câu <span id="current-question-num">1</span>/<span id="total-question-num">5</span></div>
            <h3 id="question-text" class="text-lg font-medium mb-6 leading-relaxed">
                <!-- Câu hỏi hiển thị ở đây -->
            </h3>

            <!-- Các lựa chọn đáp án -->
            <div id="options-container" class="space-y-3 flex-grow">
                <!-- Nút đáp án render bằng JS -->
            </div>

            <!-- Khu vực giải thích (ẩn đi khi chưa chọn) -->
            <div id="explanation-box" class="mt-6 p-4 rounded-lg hidden">
                <p id="feedback-msg" class="font-bold mb-1"></p>
                <p id="explanation-text" class="text-sm"></p>
            </div>

            <div class="mt-8 flex justify-end">
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md hidden transition">
                    Câu tiếp theo <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- MÀN HÌNH 3: KẾT QUẢ -->
        <div id="screen-result" class="p-8 flex-grow hidden flex-col items-center justify-center text-center">
            <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mb-4">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Hoàn thành xuất sắc!</h2>
            <p class="text-gray-600 text-lg mb-6">Bạn đã trả lời đúng <span id="final-score" class="font-bold text-green-600 text-xl">0</span> trên tổng số <span id="final-total" class="font-bold">0</span> câu hỏi.</p>
            <div class="flex gap-4">
                <button id="retry-btn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition">
                    <i class="fas fa-redo mr-1"></i> Làm lại bài này
                </button>
                <button id="back-home-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded-lg transition">
                    Chọn bài khác
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT: Logic hoạt động của trang -->
    <script>
        // ==========================================
        // DỮ LIỆU CÂU HỎI (Có thể dễ dàng thêm/sửa/xóa)
        // ==========================================
        const quizSets = [
            {
                id: 1,
                title: "Practice 1 - Unit 1: Family Life",
                desc: "Từ vựng gia đình & Thì Hiện tại đơn vs Tiếp diễn",
                questions: [
                    {
                        text: "My mother is a ________; she doesn't go to work but stays at home to look after the family.",
                        options: ["breadwinner", "homemaker", "provider", "worker"],
                        correct: 1, // Vị trí của đáp án đúng (bắt đầu từ 0)
                        explanation: "'homemaker' (người nội trợ). Mẹ không đi làm mà ở nhà chăm sóc gia đình."
                    },
                    {
                        text: "Mr. Hoang is the ________ of the family. He earns money to support his wife and children.",
                        options: ["breadwinner", "homemaker", "housewife", "babysitter"],
                        correct: 0,
                        explanation: "'breadwinner' (trụ cột gia đình, người kiếm tiền chính). Dấu hiệu: 'earns money to support'."
                    },
                    {
                        text: "Listen! My sister ________ the piano in the next room.",
                        options: ["plays", "is playing", "play", "will play"],
                        correct: 1,
                        explanation: "Có từ 'Listen!' (Hãy nghe kìa!) chỉ một hành động đang xảy ra tại thời điểm nói -> Dùng thì Hiện tại tiếp diễn (is playing)."
                    },
                    {
                        text: "We usually ________ the housework together on weekends to strengthen our family bonds.",
                        options: ["make", "take", "do", "have"],
                        correct: 2,
                        explanation: "Cụm từ cố định: 'do the housework' (làm việc nhà)."
                    },
                    {
                        text: "My husband ________ the rubbish out every evening.",
                        options: ["takes", "takes up", "takes off", "takes in"],
                        correct: 0,
                        explanation: "Cụm từ: 'take out the rubbish' (đổ rác). Động từ thêm 's' vì chủ ngữ số ít."
                    }
                ]
            },
            {
                id: 2,
                title: "Practice 2 - Unit 2: Humans & Environment",
                desc: "Từ vựng môi trường & Tương lai đơn vs Gần",
                questions: [
                    {
                        text: "We should reduce our carbon ________ to protect the environment.",
                        options: ["mark", "print", "footprint", "step"],
                        correct: 2,
                        explanation: "Cụm từ cố định: 'carbon footprint' (lượng khí thải carbon)."
                    },
                    {
                        text: "Look at those dark clouds! It ________ rain heavily.",
                        options: ["will", "is going to", "rains", "is raining"],
                        correct: 1,
                        explanation: "'is going to' được dùng khi có dấu hiệu nhận biết rõ ràng ở hiện tại (những đám mây đen)."
                    },
                    {
                        text: "Please turn off the household ________ when they are not in use to save energy.",
                        options: ["chores", "appliances", "tools", "equipments"],
                        correct: 1,
                        explanation: "'household appliances' nghĩa là thiết bị gia dụng (như TV, tủ lạnh, quạt...)."
                    },
                    {
                        text: "I think people ________ use more solar energy in the future.",
                        options: ["will", "are going to", "use", "using"],
                        correct: 0,
                        explanation: "Dự đoán không có căn cứ chắc chắn, bắt đầu bằng 'I think' -> Dùng thì Tương lai đơn (will)."
                    },
                    {
                        text: "Using public transport is an ________ way to travel and reduce air pollution.",
                        options: ["eco-friendly", "environment", "ecology", "harmful"],
                        correct: 0,
                        explanation: "'eco-friendly' (thân thiện với môi trường) là tính từ bổ nghĩa cho danh từ 'way'."
                    }
                ]
            },
            {
                id: 3,
                title: "Practice 3 - Unit 2: Passive Voice",
                desc: "Ngữ pháp Câu bị động (Passive Voice)",
                questions: [
                    {
                        text: "More trees ________ in our neighborhood every year to improve the environment.",
                        options: ["plant", "are planting", "are planted", "planted"],
                        correct: 2,
                        explanation: "Câu bị động thì Hiện tại đơn: S + am/is/are + V(pII). Trees (cây) không tự trồng được mà 'được trồng'."
                    },
                    {
                        text: "This eco-friendly house ________ by a famous architect last year.",
                        options: ["designed", "is designed", "was designed", "was designing"],
                        correct: 2,
                        explanation: "Câu bị động thì Quá khứ đơn (có 'last year'): S + was/were + V(pII)."
                    },
                    {
                        text: "Don't throw away those plastic bottles. They can be ________.",
                        options: ["recycled", "recycling", "recycle", "recycles"],
                        correct: 0,
                        explanation: "Bị động với động từ khuyết thiếu (modal verb): can be + V(pII)."
                    },
                    {
                        text: "The new club ________ by the students next month.",
                        options: ["will set up", "is going to set up", "will be set up", "setup"],
                        correct: 2,
                        explanation: "Câu bị động thì Tương lai đơn (có 'next month'): S + will be + V(pII)."
                    },
                    {
                        text: "Litter ________ in the park. It makes the park dirty.",
                        options: ["should not drop", "should not be dropped", "not drop", "don't drop"],
                        correct: 1,
                        explanation: "Bị động với 'should': should + be + V(pII). Rác 'không nên bị vứt'."
                    }
                ]
            },
            {
                id: 4,
                title: "Practice 4 - Unit 3: Music",
                desc: "Từ vựng âm nhạc & Câu ghép, To-V/V nguyên thể",
                questions: [
                    {
                        text: "The ________ cheered enthusiastically when the singer appeared on stage.",
                        options: ["audience", "viewers", "watchers", "judges"],
                        correct: 0,
                        explanation: "'audience' (khán giả trong hội trường/rạp hát). 'viewers' thường dùng cho người xem TV."
                    },
                    {
                        text: "She has a beautiful voice, ________ she has never taken any vocal lessons.",
                        options: ["and", "so", "but", "or"],
                        correct: 2,
                        explanation: "Hai vế có ý nghĩa trái ngược nhau (giọng hát hay >< chưa từng học thanh nhạc) -> Dùng liên từ 'but' (nhưng)."
                    },
                    {
                        text: "My parents let me ________ my own favorite musical instrument.",
                        options: ["choose", "to choose", "choosing", "chose"],
                        correct: 0,
                        explanation: "Cấu trúc: let + O + V (nguyên thể không to) - Cho phép ai làm gì."
                    },
                    {
                        text: "It takes a lot of time and effort ________ a musical instrument well.",
                        options: ["learn", "to learn", "learning", "learnt"],
                        correct: 1,
                        explanation: "Cấu trúc: It takes/took (+ sb) + time + to V (Mất thời gian để làm gì)."
                    },
                    {
                        text: "The ________ gave the contestants very useful feedback after their performances.",
                        options: ["fans", "instruments", "judges", "stages"],
                        correct: 2,
                        explanation: "'judges' (ban giám khảo). Giám khảo là người đưa ra nhận xét (feedback) cho thí sinh."
                    }
                ]
            },
            {
                id: 5,
                title: "Practice 5 - Mixed (Units 1-3)",
                desc: "Ôn tập tổng hợp",
                questions: [
                    {
                        text: "You can upload your singing videos on this digital ________ to share with everyone.",
                        options: ["stage", "platform", "record", "file"],
                        correct: 1,
                        explanation: "'digital platform' (nền tảng kỹ thuật số, ví dụ như YouTube, TikTok...)."
                    },
                    {
                        text: "My dad promised ________ me a new guitar if I passed the exam.",
                        options: ["buy", "to buy", "buying", "bought"],
                        correct: 1,
                        explanation: "Cấu trúc: promise + to V (Hứa làm gì)."
                    },
                    {
                        text: "I wanted to go to the BlackPink concert, ________ all the tickets were sold out.",
                        options: ["and", "so", "but", "or"],
                        correct: 2,
                        explanation: "Ý nghĩa trái ngược: muốn đi >< hết vé -> Dùng 'but'."
                    },
                    {
                        text: "My mom ________ the cooking while my dad is cleaning the floor right now.",
                        options: ["does", "is doing", "do", "did"],
                        correct: 1,
                        explanation: "Hành động đang xảy ra cùng lúc ở hiện tại ('right now', 'while') -> Hiện tại tiếp diễn."
                    },
                    {
                        text: "They are planning ________ a local environmental group.",
                        options: ["join", "to join", "joining", "joined"],
                        correct: 1,
                        explanation: "Cấu trúc: plan + to V (Dự định, lên kế hoạch làm gì)."
                    }
                ]
            }
        ];

        // ==========================================
        // CÁC BIẾN TRẠNG THÁI (STATE)
        // ==========================================
        let currentSet = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const screenSelection = document.getElementById('screen-selection');
        const screenQuiz = document.getElementById('screen-quiz');
        const screenResult = document.getElementById('screen-result');
        const setListEl = document.getElementById('set-list');
        
        const quizTitleEl = document.getElementById('quiz-title');
        const scoreDisplayEl = document.getElementById('score-display');
        const progressBarEl = document.getElementById('progress-bar');
        const currentQNumEl = document.getElementById('current-question-num');
        const totalQNumEl = document.getElementById('total-question-num');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const explanationBox = document.getElementById('explanation-box');
        const feedbackMsg = document.getElementById('feedback-msg');
        const explanationText = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        
        const finalScoreEl = document.getElementById('final-score');
        const finalTotalEl = document.getElementById('final-total');
        
        const homeBtn = document.getElementById('home-btn');
        const retryBtn = document.getElementById('retry-btn');
        const backHomeBtn = document.getElementById('back-home-btn');

        // ==========================================
        // KHỞI TẠO
        // ==========================================
        function init() {
            renderSetList();
            
            // Events buttons
            homeBtn.addEventListener('click', showSelectionScreen);
            backHomeBtn.addEventListener('click', showSelectionScreen);
            retryBtn.addEventListener('click', () => startQuiz(currentSet));
            nextBtn.addEventListener('click', handleNextQuestion);
        }

        // ==========================================
        // MÀN HÌNH CHỌN BÀI
        // ==========================================
        function renderSetList() {
            setListEl.innerHTML = '';
            quizSets.forEach((set, index) => {
                const btn = document.createElement('button');
                btn.className = "text-left p-5 rounded-xl border-2 border-gray-100 hover:border-green-500 hover:shadow-lg transition-all bg-white group cursor-pointer";
                btn.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full">Bài ${index + 1}</span>
                        <i class="fas fa-chevron-right text-gray-300 group-hover:text-green-500 transition"></i>
                    </div>
                    <h3 class="font-bold text-lg text-gray-800">${set.title}</h3>
                    <p class="text-sm text-gray-500 mt-1">${set.desc}</p>
                    <p class="text-xs text-gray-400 mt-3"><i class="far fa-question-circle"></i> ${set.questions.length} câu hỏi</p>
                `;
                btn.addEventListener('click', () => startQuiz(set));
                setListEl.appendChild(btn);
            });
        }

        function showSelectionScreen() {
            screenSelection.classList.remove('hidden');
            screenQuiz.classList.add('hidden');
            screenResult.classList.add('hidden');
            homeBtn.classList.add('hidden');
        }

        // ==========================================
        // LOGIC LÀM BÀI TRẮC NGHIỆM
        // ==========================================
        function startQuiz(set) {
            currentSet = set;
            currentQuestionIndex = 0;
            score = 0;
            
            quizTitleEl.textContent = set.title;
            totalQNumEl.textContent = set.questions.length;
            updateScoreDisplay();
            
            screenSelection.classList.add('hidden');
            screenResult.classList.add('hidden');
            screenQuiz.classList.remove('hidden');
            screenQuiz.classList.add('flex');
            homeBtn.classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            explanationBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            const q = currentSet.questions[currentQuestionIndex];
            
            // Cập nhật UI tiến độ
            currentQNumEl.textContent = currentQuestionIndex + 1;
            const progressPercent = ((currentQuestionIndex) / currentSet.questions.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // Render câu hỏi
            questionTextEl.innerHTML = q.text.replace('________', '<span class="inline-block border-b-2 border-gray-400 w-16 align-bottom mx-1"></span>');
            
            // Render đáp án (A, B, C, D)
            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-lg border-2 border-gray-200 hover:bg-gray-50 hover:border-blue-400 flex items-center font-medium bg-white";
                btn.innerHTML = `<span class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center mr-4 text-sm text-gray-600 font-bold shrink-0">${labels[index]}</span> <span>${opt}</span>`;
                
                btn.addEventListener('click', () => selectAnswer(index, btn));
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            if (isAnswered) return; // Không cho chọn lại
            isAnswered = true;
            
            const q = currentSet.questions[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('button');
            const isCorrect = selectedIndex === q.correct;

            // Vô hiệu hóa tất cả các nút
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                // Style cho nút đúng
                selectedBtn.classList.replace('border-gray-200', 'border-green-500');
                selectedBtn.classList.replace('hover:bg-gray-50', 'bg-green-50');
                selectedBtn.querySelector('span:first-child').classList.replace('bg-gray-100', 'bg-green-500');
                selectedBtn.querySelector('span:first-child').classList.replace('text-gray-600', 'text-white');
                
                score++;
                updateScoreDisplay();
                
                explanationBox.classList.remove('hidden', 'bg-red-50', 'text-red-800');
                explanationBox.classList.add('bg-green-50', 'text-green-800');
                feedbackMsg.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Chính xác!';
            } else {
                // Style cho nút sai
                selectedBtn.classList.replace('border-gray-200', 'border-red-500');
                selectedBtn.classList.replace('hover:bg-gray-50', 'bg-red-50');
                selectedBtn.querySelector('span:first-child').classList.replace('bg-gray-100', 'bg-red-500');
                selectedBtn.querySelector('span:first-child').classList.replace('text-gray-600', 'text-white');

                // Đánh dấu nút đúng
                const correctBtn = buttons[q.correct];
                correctBtn.classList.replace('border-gray-200', 'border-green-500');
                correctBtn.querySelector('span:first-child').classList.replace('bg-gray-100', 'bg-green-500');
                correctBtn.querySelector('span:first-child').classList.replace('text-gray-600', 'text-white');

                explanationBox.classList.remove('hidden', 'bg-green-50', 'text-green-800');
                explanationBox.classList.add('bg-red-50', 'text-red-800');
                feedbackMsg.innerHTML = '<i class="fas fa-times-circle mr-1"></i> Sai rồi!';
            }

            // Hiển thị giải thích
            explanationText.innerHTML = `<strong>Đáp án đúng: ${q.options[q.correct]}</strong><br><em>Giải thích:</em> ${q.explanation}`;
            explanationBox.classList.remove('hidden');
            
            // Điền từ vào chỗ trống trên câu hỏi
            const blankSpan = questionTextEl.querySelector('span.inline-block');
            if(blankSpan) {
                blankSpan.outerHTML = `<strong class="${isCorrect ? 'text-green-600' : 'text-red-600'} underline">${q.options[selectedIndex]}</strong>`;
            }

            // Hiện nút Next (hoặc Finish nếu là câu cuối)
            if (currentQuestionIndex === currentSet.questions.length - 1) {
                nextBtn.innerHTML = 'Xem kết quả <i class="fas fa-flag-checkered ml-1"></i>';
                nextBtn.classList.replace('bg-blue-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
            } else {
                nextBtn.innerHTML = 'Câu tiếp theo <i class="fas fa-arrow-right ml-1"></i>';
                nextBtn.classList.replace('bg-green-600', 'bg-blue-600');
                nextBtn.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
            }
            nextBtn.classList.remove('hidden');
        }

        function handleNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentSet.questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function updateScoreDisplay() {
            scoreDisplayEl.innerHTML = `<i class="fas fa-star text-yellow-400 mr-1"></i> Điểm: ${score}`;
        }

        // ==========================================
        // MÀN HÌNH KẾT QUẢ
        // ==========================================
        function finishQuiz() {
            screenQuiz.classList.remove('flex');
            screenQuiz.classList.add('hidden');
            
            screenResult.classList.remove('hidden');
            screenResult.classList.add('flex');
            
            finalScoreEl.textContent = score;
            finalTotalEl.textContent = currentSet.questions.length;
            
            // Full thanh tiến trình
            progressBarEl.style.width = '100%';
        }

        // Chạy ứng dụng khi load xong trang
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
