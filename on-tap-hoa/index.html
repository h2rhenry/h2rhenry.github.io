<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng Tuần Hoàn — Hóa Học 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0369a1;--g:#047857;--grad:linear-gradient(135deg,#047857,#0369a1);--bg:#f0f9ff;--sf:#fff;--tx:#0f172a;--mu:#475569;--bd:#cbd5e1;--ok:#047857;--ok-bg:#d1fae5;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#92400e;--warn-bg:#fef3c7;--r:16px;--sh:0 8px 24px -10px rgba(15,23,42,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;color:var(--tx);min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 16px 56px;background:var(--bg) radial-gradient(at 0 0,#bae6fd 0,transparent 45%) no-repeat,radial-gradient(at 100% 100%,#a7f3d0 0,transparent 45%) no-repeat;background-attachment:fixed}
.hidden{display:none!important}
.container{max-width:860px;margin:0 auto}
:focus-visible{outline:3px solid #0ea5e9;outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:99}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;text-align:center;line-height:1.2;margin:16px 0 8px;color:var(--p);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--mu);font-size:1.05rem;margin-bottom:28px}
.h2{font-size:1.25rem;font-weight:800}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 28px;border:2px solid transparent;border-radius:999px;font:700 1rem/1.2 inherit;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 4px 14px rgba(3,105,161,.3);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(3,105,161,.35)}
.btn:active{transform:none}
.btn-o{background:#fff;color:var(--p);border-color:var(--p);box-shadow:none}.btn-o:hover{background:#e0f2fe;box-shadow:none}
.btn-sm{min-height:44px;padding:8px 18px;font-size:.95rem}
.btn-d{background:#fff;color:var(--bad);border-color:var(--bad);box-shadow:none}.btn-d:hover{background:var(--bad-bg);box-shadow:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--sf);border:1px solid #e2e8f0;border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:20px}
/* home */
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:28px}
.test-card{text-align:left;display:flex;flex-direction:column;gap:6px;padding:20px;border:2px solid transparent;border-radius:var(--r);background:#fff;box-shadow:var(--sh);cursor:pointer;font:inherit;color:inherit;transition:transform .2s,border-color .2s}
.test-card:hover{transform:translateY(-3px);border-color:var(--p)}
.test-card b{font-size:1.25rem;color:var(--p)}.test-card span{color:var(--mu);font-size:.92rem}
.hist{list-style:none;display:grid;gap:10px}
.hi{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc}
