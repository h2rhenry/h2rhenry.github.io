<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tuần Hoàn — Hóa Học 10</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-gradient: linear-gradient(135deg, #10b981, #0ea5e9);
            --bg-color: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #334155;
            --text-muted: #64748b;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --border: #e2e8f0;
            --radius: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background: var(--bg-color); background-image: radial-gradient(at 0% 0%, hsla(199,95%,86%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(158,85%,88%,1) 0, transparent 50%); color: var(--text-main); line-height: 1.6; min-height: 100vh; padding: 20px; padding-top: 40px; }
        .hidden { display: none !important; }
        
        .container { max-width: 850px; margin: 0 auto; }
        h1 { font-size: 3rem; font-weight: 800; text-align: center; margin-bottom: 10px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { text-align: center; font-size: 1.2rem; color: var(--text-muted); margin-bottom: 40px; }

        /* BUTTONS */
        .btn { background: var(--primary-gradient); color: white; border: none; padding: 16px 32px; font-size: 1.1rem; font-weight: 700; border-radius: 50px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4); }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); box-shadow: none; }
        .btn-outline:hover { background: var(--bg-color); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.15); }
        .flex-center { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        /* CARDS */
        .card { background: var(--card-bg); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 30px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-2px); }

        /* HISTORY */
        .history-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .history-list { list-style: none; }
        .history-item { padding: 15px 20px; background: white; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid var(--border); }
        .score-badge { background: var(--primary-gradient); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 1.1rem; }

        /* QUIZ TOPBAR */
        .quiz-topbar { background: var(--card-bg); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 20px; z-index: 50; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.8); }
        .timer { font-size: 1.5rem; font-weight: 800; color: var(--danger); background: var(--danger-bg); padding: 8px 20px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; }
        .progress-container { flex-grow: 1; margin: 0 30px; background: var(--border); height: 12px; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary-gradient); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-text { font-weight: 700; color: var(--text-muted); font-size: 1.1rem; }

        /* QUESTIONS */
        .question-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; color: var(--text-main); }
        
        /* OPTIONS */
        .option-label { display: flex; align-items: center; padding: 16px 20px; background: white; border: 2px solid var(--border); border-radius: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .option-label:hover { border-color: var(--primary); background: #f8fafc; transform: translateX(5px); }
        .option-label input { margin-right: 15px; width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; }
        
        /* TRUE/FALSE */
        .tf-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: white; border: 2px solid var(--border); border-radius: 16px; margin-bottom: 10px; transition: all 0.2s; }
        .tf-text { font-weight: 600; flex-grow: 1; padding-right: 20px; }
        .tf-actions { display: flex; gap: 20px; background: #f1f5f9; padding: 8px 15px; border-radius: 12px; }
        .tf-actions label { font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .tf-actions input { width: 18px; height: 18px; accent-color: var(--primary); }

        /* STEPPER */
        .stepper-wrap { display: flex; align-items: center; gap: 10px; }
        .stepper-btn { width: 45px; height: 45px; border-radius: 12px; border: none; background: #f1f5f9; color: var(--text-main); font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .stepper-btn:hover { background: var(--primary); color: white; }
        .stepper-input { width: 100px; height: 45px; border-radius: 12px; border: 2px solid var(--border); text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        .stepper-input:focus { outline: none; border-color: var(--primary); }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; padding: 40px; border-radius: 24px; text-align: center; max-width: 450px; width: 90%; transform: translateY(20px); transition: 0.3s; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-box h3 { font-size: 2rem; font-weight: 800; margin-bottom: 15px; color: var(--text-main); }
        .modal-box p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; }

        /* RESULTS */
        .result-header { text-align: center; margin-bottom: 40px; }
        .result-score { font-size: 6rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 20px 0; }
        
        .opt-correct { background: var(--success-bg) !important; border-color: var(--success) !important; color: #065f46; }
        .opt-wrong { background: var(--danger-bg) !important; border-color: var(--danger) !important; color: #991b1b; }
        .explanation { margin-top: 20px; padding: 20px; background: #f8fafc; border-radius: 16px; border-left: 5px solid var(--primary); color: var(--text-main); font-size: 1.05rem; }
        .ans-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; margin-top: 8px; }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .quiz-topbar { flex-direction: column; gap: 15px; text-align: center; }
            .progress-container { width: 100%; margin: 10px 0; }
            .tf-row { flex-direction: column; align-items: flex-start; gap: 15px; }
            .tf-actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="start-screen" class="container">
        <h1>Bảng Tuần Hoàn 10</h1>
        <p class="subtitle">Ôn luyện trắc nghiệm, đúng/sai và điền khuyết Hóa Học.</p>
        
        <div class="flex-center" style="margin-bottom: 50px;">
            <button class="btn" onclick="startTest('de1')">Bắt đầu Đề 1</button>
            <button class="btn" onclick="startTest('de2')">Bắt đầu Đề 2</button>
        </div>
        
        <div class="card">
            <h3 class="history-title">Lịch sử làm bài</h3>
            <ul class="history-list" id="history-list"></ul>
        </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="hidden container">
        <div class="quiz-topbar">
            <div class="timer" id="timer">20:00</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text"><span id="answered-count">0</span> / <span id="total-count">0</span></div>
        </div>
        
        <div id="questions-container"></div>
        
        <div class="flex-center" style="margin: 40px 0;">
            <button class="btn" onclick="showSubmitModal()" id="btn-submit">Nộp bài ngay</button>
        </div>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="result-screen" class="hidden container">
        <div class="card result-header">
            <h2>Hoàn thành bài thi!</h2>
            <div class="result-score" id="result-score">0.0</div>
            <button class="btn btn-outline" onclick="window.location.reload()">Trở về trang chủ</button>
        </div>
        <div id="review-container"></div>
    </div>

    <!-- MODAL NỘP BÀI -->
    <div id="submit-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Xác nhận nộp bài?</h3>
            <p id="modal-msg"></p>
            <div class="flex-center">
                <button class="btn btn-outline" onclick="closeModal()">Quay lại</button>
                <button class="btn" onclick="submitTest()">Nộp bài</button>
            </div>
        </div>
    </div>
</div>

<script>
    const tests = {
        de1: [
            { type: "mcq", q: "Mendeleev sắp xếp các nguyên tố hóa học vào bảng tuần hoàn dựa theo quy luật về", options: [ {text: "khối lượng nguyên tử.", correct: true}, {text: "cấu hình electron.", correct: false}, {text: "số hiệu nguyên tử.", correct: false}, {text: "số khối.", correct: false} ], exp: "Bảng tuần hoàn của Mendeleev được xây dựng dựa trên nguyên tắc sắp xếp theo chiều tăng dần khối lượng nguyên tử[cite: 1]." },
            { type: "mcq", q: "Bảng tuần hoàn hiện nay áp dụng nguyên tắc sắp xếp nào sau đây?", options: [ {text: "Mỗi nguyên tố hóa học được xếp vào một ô trong bảng tuần hoàn.", correct: true}, {text: "Các nguyên tố có cấu hình electron tương tự nhau được xếp cùng một hàng.", correct: false}, {text: "Các nguyên tố được sắp xếp theo chiều tăng dần khối lượng nguyên tử.", correct: false}, {text: "Các nguyên tố có cùng số lớp electron trong nguyên tử được xếp thành một nhóm.", correct: false} ], exp: "Nguyên tắc của BTH hiện đại là mỗi nguyên tố xếp vào 1 ô, xếp theo chiều tăng điện tích hạt nhân, cùng lớp e thì xếp vào cùng chu kì (hàng), cùng số e hóa trị thì xếp vào cùng nhóm (cột)[cite: 1]." },
            { type: "mcq", q: "Số hiệu nguyên tử của nguyên tố hóa học bằng", options: [ {text: "số thứ tự của ô nguyên tố.", correct: true}, {text: "số thứ tự của chu kì.", correct: false}, {text: "số thứ tự của nhóm.", correct: false}, {text: "số electron lớp ngoài cùng của nguyên tử.", correct: false} ], exp: "Trong bảng tuần hoàn, số hiệu nguyên tử (Z) chính là số thứ tự của ô nguyên tố[cite: 1]." },
            { type: "mcq", q: "Nhóm nguyên tố là", options: [ {text: "tập hợp các nguyên tố mà nguyên tử có cấu hình electron tương tự nhau, do đó có tính chất hóa học gần giống nhau và được xếp cùng một cột.", correct: true}, {text: "tập hợp các nguyên tố mà nguyên tử có cùng cấu hình electron giống nhau được xếp ở cùng một cột.", correct: false}, {text: "tập hợp các nguyên tố mà nguyên tử có tính chất hóa học giống nhau và được xếp cùng một cột.", correct: false}, {text: "tập hợp các nguyên tố mà nguyên tử có cấu hình electron gần giống nhau, được xếp thành một cột.", correct: false} ], exp: "Nhóm nguyên tố tập hợp các nguyên tố có cấu hình electron tương tự nhau, dẫn tới tính chất hoá học gần giống nhau và được xếp cùng một cột[cite: 1]." },
            { type: "mcq", q: "Nguyên tử của những nguyên tố trong một nhóm đều có cùng số", options: [ {text: "Electron hóa trị.", correct: true}, {text: "Proton.", correct: false}, {text: "Neutron.", correct: false}, {text: "Lớp electron.", correct: false} ], exp: "Đặc trưng của các nguyên tố trong cùng một nhóm là nguyên tử của chúng đều có cùng số electron hóa trị[cite: 1]." },
            { type: "mcq", q: "Chu kì là dãy các nguyên tố được sắp xếp theo chiều điện tích hạt nhân tăng dần, nguyên tử của chúng có cùng ?", options: [ {text: "Số lớp electron.", correct: true}, {text: "Số electron.", correct: false}, {text: "Số electron hóa trị.", correct: false}, {text: "Số electron ở lớp ngoài cùng.", correct: false} ], exp: "Chu kì là tập hợp các nguyên tố mà nguyên tử của chúng có cùng số lớp electron[cite: 1]." },
            { type: "mcq", q: "Ô nguyên tố không cho biết thông tin nào sau đây?", options: [ {text: "Số khối của hạt nhân", correct: true}, {text: "Kí hiệu nguyên tử", correct: false}, {text: "Tên nguyên tố", correct: false}, {text: "Số hiệu nguyên tử", correct: false} ], exp: "Ô nguyên tố cho biết khối lượng nguyên tử trung bình chứ không cho biết số khối (A) của một đồng vị cụ thể[cite: 1]." },
            { type: "mcq", q: "Nhóm A bao gồm các nguyên tố:", options: [ {text: "Nguyên tố s và nguyên tố p.", correct: true}, {text: "Nguyên tố s.", correct: false}, {text: "Nguyên tố p.", correct: false}, {text: "Nguyên tố d và nguyên tố f.", correct: false} ], exp: "Nhóm A chứa các nguyên tố họ s và p. Nhóm B chứa các nguyên tố họ d và f[cite: 1]." },
            { type: "mcq", q: "Số electron hóa trị trong nguyên tử chlorine (Z = 17) là:", options: [ {text: "7.", correct: true}, {text: "5.", correct: false}, {text: "3.", correct: false}, {text: "1.", correct: false} ], exp: "Cl (Z=17) có cấu hình e: [Ne] 3s² 3p⁵. Có 7 electron ở lớp ngoài cùng, đây cũng chính là số electron hóa trị[cite: 1]." },
            { type: "mcq", q: "Vị trí của nguyên tố có Z = 15 trong bảng tuần hoàn là", options: [ {text: "Chu kì 3, nhóm VA.", correct: true}, {text: "Chu kì 4, nhóm VIB.", correct: false}, {text: "Chu kì 4, nhóm IIA.", correct: false}, {text: "Chu kì 3, nhóm IIB.", correct: false} ], exp: "Cấu hình e (Z=15): 1s² 2s² 2p⁶ 3s² 3p³. Có 3 lớp e (Chu kì 3), 5e lớp ngoài cùng thuộc phân lớp s và p (Nhóm VA)[cite: 2]." },
            { type: "mcq", q: "Trong một chu kì, bán kính nguyên tử các nguyên tố", options: [ {text: "Giảm theo chiều tăng của điện tích hạt nhân.", correct: true}, {text: "Tăng theo chiều tăng của điện tích hạt nhân.", correct: false}, {text: "Tăng theo chiều tăng của tính phi kim.", correct: false}, {text: "Giảm theo chiều tăng của tính kim loại.", correct: false} ], exp: "Trong một chu kì, từ trái sang phải, điện tích hạt nhân tăng dần, lực hút giữa hạt nhân với vỏ e tăng làm vỏ nguyên tử co lại, dẫn đến bán kính giảm dần[cite: 2]." },
            { type: "mcq", q: "Độ âm điện đặc trưng cho khả năng", options: [ {text: "hút electron của nguyên tử.", correct: true}, {text: "nhường electron của nguyên tử.", correct: false}, {text: "tham gia phản ứng mạnh, yếu.", correct: false}, {text: "tính bazo của nguyên tử.", correct: false} ], exp: "Độ âm điện là đại lượng đặc trưng cho khả năng hút electron của nguyên tử khi hình thành liên kết hóa học[cite: 3]." },
            { type: "mcq", q: "Trong chu kì, từ trái sang phải, theo chiều điện tích hạt nhân tăng dần", options: [ {text: "Tính kim loại giảm, tính phi kim tăng.", correct: true}, {text: "Tính kim loại tăng, tính phi kim giảm.", correct: false}, {text: "Tính kim loại tăng, tính phi kim tăng.", correct: false}, {text: "Tính kim loại giảm, tính phi kim giảm.", correct: false} ], exp: "Do bán kính giảm, nguyên tử khó nhường e và dễ nhận e hơn, nên tính kim loại giảm và tính phi kim tăng dần[cite: 3]." },
            { type: "mcq", q: "Cho các nguyên tử 6C; 7N; 14Si; 15P. Nguyên tử có bán kính lớn nhất là", options: [ {text: "Si.", correct: true}, {text: "N.", correct: false}, {text: "P.", correct: false}, {text: "C.", correct: false} ], exp: "C và N thuộc chu kì 2; Si và P thuộc chu kì 3 (nhiều lớp e hơn nên bán kính lớn hơn). Trong chu kì 3, Z của Si (14) nhỏ hơn P (15) nên bán kính Si > P. Lớn nhất là Si[cite: 4]." },
            { type: "mcq", q: "Trong các chất dưới đây, chất nào có tính acid yếu nhất?", options: [ {text: "H2SiO3.", correct: true}, {text: "H2SO4.", correct: false}, {text: "HClO4.", correct: false}, {text: "H3PO4.", correct: false} ], exp: "Tính phi kim của Si là yếu nhất trong dãy Si, P, S, Cl nên hydroxide tương ứng H2SiO3 có tính acid yếu nhất[cite: 5]." },
            { type: "tf", q: "Cho cấu hình electron: X: 1s²2s²2p⁶3s²3p³; Y: 1s²2s²2p⁶3s²3p⁶3d³4s². Đánh giá tính Đúng/Sai:", statements: [ {text: "a. X và Y đều có 5 electron hóa trị.", correct: true}, {text: "b. X là nguyên tố s, X thuộc nhóm VA.", correct: false}, {text: "c. Y là nguyên tố p, Y thuộc nhóm VB.", correct: false}, {text: "d. X và Y đều là kim loại.", correct: false} ], exp: "a Đúng (X có 5e ngoài cùng, Y có 3e d + 2e s = 5e hoá trị). b Sai (X là nguyên tố p). c Sai (Y là nguyên tố d). d Sai (X thuộc nhóm VA, là phi kim P)[cite: 5]." },
            { type: "tf", q: "Borax (Na2B4O7.10H2O) chứa Sodium (11Na), boron (5B) và oxygen (8O). Đánh giá Đúng/Sai:", statements: [ {text: "a. Na thuộc chu kì 3, nhóm IA.", correct: true}, {text: "b. O thuộc chu kì 2, nhóm IVA.", correct: false}, {text: "c. Thứ tự bán kính nguyên tử tăng dần: O > B > Na.", correct: false}, {text: "d. Thứ tự độ âm điện giảm dần: O > B > Na.", correct: true} ], exp: "a Đúng (Na: [Ne] 3s¹). b Sai (O: [He] 2s²2p⁴ nhóm VIA). c Sai (Thứ tự đúng là O < B < Na). d Đúng (Tính phi kim O > B > Na nên ĐÂĐ O > B > Na)[cite: 5]." },
            { type: "sa", q: "Cho các nguyên tố A(Z=4), X(Z=8), Y(Z=9), M(Z=11), R(Z=12), T(Z=15). Có bao nhiêu nguyên tố là kim loại?", correct: 3, step: 1, exp: "Nguyên tố kim loại thường có 1, 2, 3 e ngoài cùng. Be(2e), Na(1e), Mg(2e) là kim loại. O, F, P là phi kim. Có 3 KL[cite: 7]." },
            { type: "sa", q: "3 quả cầu A, B, C tượng trưng nguyên tử helium, krypton, radon theo thứ tự tăng dần kích thước 1,2,3. Quả cầu krypton là số nào?", correct: 2, step: 1, exp: "He, Kr, Rn đều là khí hiếm nhóm VIIIA. Bán kính tăng từ trên xuống: He < Kr < Rn. Kr nằm giữa nên là số 2[cite: 7]." },
            { type: "sa", q: "Nguyên tố có X(Z=8), số electron hóa trị của nguyên tử nguyên tố X là bao nhiêu?", correct: 6, step: 1, exp: "X (Z=8) là Oxygen. Cấu hình 1s²2s²2p⁴. Lớp ngoài cùng có 6 electron, đây cũng là số e hoá trị[cite: 7]." }
        ],
        de2: [
            { type: "mcq", q: "Trong bảng tuần hoàn các nguyên tố, số chu kì nhỏ và chu kì lớn là", options: [ {text: "3 và 4.", correct: true}, {text: "3 và 3.", correct: false}, {text: "4 và 4.", correct: false}, {text: "4 và 3.", correct: false} ], exp: "Bảng tuần hoàn có 7 chu kì. Chu kì 1, 2, 3 là chu kì nhỏ. Chu kì 4, 5, 6, 7 là chu kì lớn[cite: 1]." },
            { type: "mcq", q: "Bảng tuần hoàn hiện nay có số cột, số nhóm A và số nhóm B lần lượt là", options: [ {text: "18, 8, 8.", correct: true}, {text: "18, 8, 10.", correct: false}, {text: "18, 10, 8.", correct: false}, {text: "16, 8, 8.", correct: false} ], exp: "Bảng tuần hoàn có 18 cột, chia thành 8 nhóm A (8 cột) và 8 nhóm B (10 cột)[cite: 1]." },
            { type: "mcq", q: "Số electron hóa trị trong nguyên tử chromium (Z = 24) là:", options: [ {text: "6.", correct: true}, {text: "1.", correct: false}, {text: "3.", correct: false}, {text: "4.", correct: false} ], exp: "Cr (Z=24) có cấu hình [Ar] 3d⁵ 4s¹. Số e hóa trị = 5+1 = 6[cite: 1]." },
            { type: "mcq", q: "Cấu hình electron của nguyên tử sắt là 1s²2s²2p⁶3s²3p⁶3d⁶4s². Vị trí của sắt trong bảng tuần hoàn là", options: [ {text: "ô số 26, chu kì 4, nhóm VIIIB.", correct: true}, {text: "ô số 26, chu kì 3, nhóm VIIIB.", correct: false}, {text: "ô số 26, chu kì 3, nhóm VIIIA.", correct: false}, {text: "ô số 26, chu kì 4, nhóm VIIIA.", correct: false} ], exp: "Z = 26. 4 lớp e (chu kì 4). Nhóm B, 6+2 = 8 e hóa trị -> Nhóm VIIIB[cite: 2]." },
            { type: "mcq", q: "Trong bảng tuần hoàn, nguyên tố thuộc nhóm IIA, chu kì 3 là", options: [ {text: "12Mg.", correct: true}, {text: "26Fe.", correct: false}, {text: "11Na.", correct: false}, {text: "13Al.", correct: false} ], exp: "Chu kì 3, Nhóm IIA. Cấu hình [Ne] 3s² -> Z=12 (Mg)[cite: 2]." },
            { type: "mcq", q: "Nguyên tử sulfur có phân lớp electron ngoài cùng là 3p⁴. Phát biểu nào sau đây là sai?", options: [ {text: "Hạt nhân nguyên tử sulfur có 16 electron.", correct: true}, {text: "Lớp ngoài cùng của sulfur có 6 electron.", correct: false}, {text: "Trong bảng tuần hoàn sulfur nằm ở chu kỳ 3.", correct: false}, {text: "Sulfur nằm ở nhóm VIA.", correct: false} ], exp: "Hạt nhân chứa proton và neutron. Electron nằm ở lớp vỏ nguyên tử. A sai[cite: 2]." },
            { type: "mcq", q: "Trong 20 nguyên tố đầu tiên của bảng tuần hoàn, đại lượng nào sau đây biến đổi tuần hoàn?", options: [ {text: "Số electron lớp ngoài cùng.", correct: true}, {text: "Khối lượng nguyên tử.", correct: false}, {text: "Số proton trong hạt nhân nguyên tử.", correct: false}, {text: "Số neutron trong hạt nhân nguyên tử.", correct: false} ], exp: "Chỉ có số electron lớp ngoài cùng lặp lại sau mỗi chu kì (biến đổi tuần hoàn)[cite: 2]." },
            { type: "mcq", q: "Trong một nhóm A (trừ nhóm VIIIA), theo chiều tăng của điện tích hạt nhân nguyên tử thì", options: [ {text: "tính phi kim giảm dần, bán kính nguyên tử tăng dần.", correct: true}, {text: "tính kim loại tăng dần, độ âm điện tăng dần.", correct: false}, {text: "độ âm điện giảm dần, tính phi kim tăng dần.", correct: false}, {text: "tính kim loại tăng dần, bán kính nguyên tử giảm dần.", correct: false} ], exp: "Trong 1 nhóm, từ trên xuống bán kính tăng, khả năng nhường e tăng nên tính kim loại tăng, tính phi kim giảm[cite: 3]." },
            { type: "mcq", q: "Độ âm điện của các nguyên tố: 9F, 17Cl, 35Br, 53I. Xếp theo chiều giảm dần là:", options: [ {text: "F > Cl > Br > I", correct: true}, {text: "I > Br > Cl > F", correct: false}, {text: "Cl > F > I > Br", correct: false}, {text: "I > Br > F > Cl", correct: false} ], exp: "Nhóm VIIA từ trên xuống dưới độ âm điện giảm dần[cite: 4]." },
            { type: "mcq", q: "Cho 11Na, 12Mg, 13Al, 19K. Dãy các nguyên tố xếp theo chiều tính kim loại tăng dần là", options: [ {text: "Al, Mg, Na, K.", correct: true}, {text: "Mg, Al, Na, K.", correct: false}, {text: "K, Na, Mg, Al.", correct: false}, {text: "Na, K, Mg, Al.", correct: false} ], exp: "Chu kì 3: Al < Mg < Na. Nhóm IA: Na < K. Kết hợp: Al < Mg < Na < K[cite: 4]." },
            { type: "mcq", q: "Chọn oxide có tính base mạnh nhất", options: [ {text: "BaO.", correct: true}, {text: "BeO.", correct: false}, {text: "CO2.", correct: false}, {text: "Al2O3.", correct: false} ], exp: "Tính bazo thuận chiều tính kim loại. Ba có tính kim loại mạnh nhất nên BaO có tính base mạnh nhất[cite: 4]." },
            { type: "mcq", q: "Thứ tự tăng dần tính base của các hydroxide Mg(OH)2, Ba(OH)2, Al(OH)3 là:", options: [ {text: "Al(OH)3 < Mg(OH)2 < Ba(OH)2.", correct: true}, {text: "Ba(OH)2 < Mg(OH)2 < Al(OH)3.", correct: false}, {text: "Mg(OH)2 < Ba(OH)2 < Al(OH)3.", correct: false}, {text: "Al(OH)3 < Ba(OH)2 < Mg(OH)2.", correct: false} ], exp: "Tính kim loại tăng dần Al < Mg < Ba nên tính base tăng dần Al(OH)3 < Mg(OH)2 < Ba(OH)2[cite: 5]." },
            { type: "mcq", q: "Dãy nào sau đây sắp xếp theo thứ tự tăng dần tính acid?", options: [ {text: "Al2O3; P2O5; SO3; Cl2O7.", correct: true}, {text: "Cl2O7; Al2O3; SO3; P2O5.", correct: false}, {text: "P2O5; SO3; Al2O3; Cl2O7.", correct: false}, {text: "Al2O3; SO3; P2O5; Cl2O7.", correct: false} ], exp: "Tính acid tăng dần theo tính phi kim: Al2O3 < P2O5 < SO3 < Cl2O7[cite: 5]." },
            { type: "mcq", q: "Nguyên tử của nguyên tố nào sau đây có bán kính nhỏ nhất?", options: [ {text: "P (Z=15)", correct: true}, {text: "Si (Z=14)", correct: false}, {text: "Ge (Z=32)", correct: false}, {text: "As (Z=33)", correct: false} ], exp: "Chu kì 3 (Si, P) nhỏ hơn chu kì 4. Trong chu kì 3, Z tăng thì R giảm nên P < Si[cite: 4]." },
            { type: "mcq", q: "Nguyên tố nào trong số các nguyên tố sau có độ âm điện nhỏ nhất?", options: [ {text: "19K.", correct: true}, {text: "12Mg.", correct: false}, {text: "20Ca.", correct: false}, {text: "13Al.", correct: false} ], exp: "K là kim loại điển hình mạnh nhất trong nhóm, nên có độ âm điện nhỏ nhất[cite: 4]." },
            { type: "tf", q: "So sánh Mg(Z=12), Be(Z=4), Ca(Z=20). Đánh giá Đúng/Sai:", statements: [ {text: "a. Be: 1s²2s², Mg: [Ne]3s², Ca: [Ar]4s².", correct: true}, {text: "b. Cả 3 nguyên tố đều thuộc nhóm IIIA.", correct: false}, {text: "c. Tính kim loại của Be < Mg < Ca.", correct: true}, {text: "d. Tính base của Be(OH)2 > Mg(OH)2 > Ca(OH)2.", correct: false} ], exp: "a Đúng. b Sai (Nhóm IIA). c Đúng (Cùng nhóm R tăng). d Sai (Tính base Be(OH)2 < Mg(OH)2 < Ca(OH)2)[cite: 6]." },
            { type: "tf", q: "Phosphorus (P) ở ô số 15, chu kì 3, nhóm VA. Đánh giá tính Đúng/Sai:", statements: [ {text: "a. Số electron lớp ngoài cùng của P là 5.", correct: true}, {text: "b. Oxide cao nhất là P2O3, có tính acidic.", correct: false}, {text: "c. Phosphorus có tính phi kim.", correct: true}, {text: "d. Hydroxide cao nhất là H3PO4 có tính acid.", correct: true} ], exp: "a Đúng. b Sai (Oxide cao nhất là P2O5). c Đúng. d Đúng[cite: 6]." },
            { type: "sa", q: "Cho X(Z=11), Y(Z=13), Z(Z=19) và độ âm điện 0,82; 1,31; 0,93. Độ âm điện của Y là bao nhiêu?", correct: 1.31, step: 0.01, exp: "X(Na), Y(Al), Z(K). Độ âm điện Al lớn nhất do tính phi kim trội hơn. Số lớn nhất là 1.31[cite: 7]." },
            { type: "sa", q: "Bán kính nguyên tử của Al, Mg, Si là các giá trị: 143; 118; 160 (pm). Bán kính nguyên tử của Al là bao nhiêu?", correct: 143, step: 1, exp: "Chu kì 3 Z tăng bán kính giảm (Mg > Al > Si). Al ở giữa ứng với 143 pm[cite: 7]." },
            { type: "sa", q: "Cho Mg: [Ne]3s²; Fe: [Ar]3d⁶4s²; Br: [Ar]3d¹⁰4s²4p⁵; N: 1s²2s²2p³; Cu: [Ar]3d¹⁰4s¹. Bao nhiêu nguyên tố thuộc khối d?", correct: 2, step: 1, exp: "Nguyên tố khối d có e cuối điền vào phân lớp d (Fe và Cu). Có 2 nguyên tố[cite: 7]." }
        ]
    };

    let currentTestId = '';
    let currentQuestions = [];
    let userAnswers = {};
    let timeRemaining = 20 * 60; 
    let timerInterval;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    window.renderHistory = function() {
        const history = JSON.parse(localStorage.getItem('chemHistory')) || [];
        const ul = document.getElementById('history-list');
        if(history.length === 0) {
            ul.innerHTML = '<li class="history-item" style="justify-content:center; color:var(--text-muted)">Chưa có lịch sử làm bài.</li>';
            return;
        }
        // Dùng slice().reverse() để không làm thay đổi mảng gốc
        ul.innerHTML = history.slice().reverse().slice(0,5).map(h => `
            <li class="history-item">
                <span>${h.date} — <strong>${h.testName}</strong></span>
                <span class="score-badge">${h.score} / 10</span>
            </li>
        `).join('');
    }
    renderHistory();

    window.startTest = function(testId) {
        currentTestId = testId;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        userAnswers = {};
        timeRemaining = 20 * 60;
        
        let clonedTest = JSON.parse(JSON.stringify(tests[testId]));
        currentQuestions = shuffleArray(clonedTest);
        
        currentQuestions.forEach(q => {
            if(q.type === 'mcq') q.options = shuffleArray(q.options);
        });

        renderQuestions(currentQuestions);
        updateProgress();
        startTimer();
        window.scrollTo(0,0);
    }

    window.renderQuestions = function(questions) {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        
        questions.forEach((q, index) => {
            let html = `<div class="card" id="card-${index}">
                <div class="question-title">${index + 1}. ${q.q}</div>`;
            
            if (q.type === 'mcq') {
                q.options.forEach((opt, oIndex) => {
                    html += `
                        <label class="option-label">
                            <input type="radio" name="q_${index}" value="${oIndex}" onchange="markAnswered(${index})">
                            ${opt.text}
                        </label>`;
                });
            } 
            else if (q.type === 'tf') {
                q.statements.forEach((stmt, sIndex) => {
                    html += `
                        <div class="tf-row">
                            <div class="tf-text">${stmt.text}</div>
                            <div class="tf-actions">
                                <label><input type="radio" name="q_${index}_s_${sIndex}" value="true" onchange="markAnswered(${index})"> Đ</label>
                                <label><input type="radio" name="q_${index}_s_${sIndex}" value="false" onchange="markAnswered(${index})"> S</label>
                            </div>
                        </div>`;
                });
            }
            else if (q.type === 'sa') {
                html += `
                    <div class="stepper-wrap">
                        <button class="stepper-btn" onclick="updateStepper('input_${index}', -1, ${q.step}, ${index})">-</button>
                        <input type="number" id="input_${index}" class="stepper-input" value="0" step="${q.step}" onchange="markAnswered(${index})">
                        <button class="stepper-btn" onclick="updateStepper('input_${index}', 1, ${q.step}, ${index})">+</button>
                    </div>`;
            }
            
            html += `<div id="exp-${index}" class="explanation hidden"></div></div>`;
            container.innerHTML += html;
        });
        document.getElementById('total-count').innerText = questions.length;
    }

    window.updateStepper = function(id, delta, step, qIndex) {
        let input = document.getElementById(id);
        let val = parseFloat(input.value) || 0;
        let decimals = step < 1 ? 2 : 0;
        input.value = (val + delta * step).toFixed(decimals);
        markAnswered(qIndex);
    }

    window.markAnswered = function(index) {
        userAnswers[index] = true; 
        updateProgress();
    }

    window.updateProgress = function() {
        let answered = 0;
        currentQuestions.forEach((q, i) => {
            if (q.type === 'mcq') {
                if (document.querySelector(`input[name="q_${i}"]:checked`)) answered++;
            } else if (q.type === 'tf') {
                let allChecked = true;
                q.statements.forEach((_, s) => {
                    if (!document.querySelector(`input[name="q_${i}_s_${s}"]:checked`)) allChecked = false;
                });
                if (allChecked) answered++;
            } else if (q.type === 'sa') {
                if (document.getElementById(`input_${i}`).value !== "") answered++;
            }
        });
        
        document.getElementById('answered-count').innerText = answered;
        let percent = (answered / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = percent + '%';
        return answered;
    }

    window.startTimer = function() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            let s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
            
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                submitTest(true); 
            }
        }, 1000);
    }

    window.showSubmitModal = function() {
        let answered = updateProgress();
        let total = currentQuestions.length;
        let msg = answered < total 
            ? `Bạn mới hoàn thành <b>${answered}/${total}</b> câu. Chắc chắn muốn nộp bài sớm?` 
            : `Tuyệt vời, bạn đã trả lời toàn bộ câu hỏi!`;
        document.getElementById('modal-msg').innerHTML = msg;
        document.getElementById('submit-modal').classList.add('active');
    }

    window.closeModal = function() {
        document.getElementById('submit-modal').classList.remove('active');
    }

    window.submitTest = function(isAuto = false) {
        clearInterval(timerInterval);
        closeModal();
        document.getElementById('btn-submit').classList.add('hidden'); 
        
        let totalScore = 0;
        let maxRawPoints = 0;

        currentQuestions.forEach((q, i) => {
            let card = document.getElementById(`card-${i}`);

            if (q.type === 'mcq') {
                maxRawPoints += 1;
                let selected = document.querySelector(`input[name="q_${i}"]:checked`);
                let correctIdx = q.options.findIndex(o => o.correct);
                
                card.querySelectorAll('.option-label').forEach((lbl, idx) => {
                    if (idx === correctIdx) lbl.classList.add('opt-correct');
                    if (selected && selected.value == idx && idx !== correctIdx) {
                        lbl.classList.add('opt-wrong');
                    }
                });

                if (selected && parseInt(selected.value) === correctIdx) {
                    totalScore += 1;
                }
            } 
            else if (q.type === 'tf') {
                maxRawPoints += 1; 
                let qPoints = 0;
                q.statements.forEach((stmt, s) => {
                    let selTrue = document.querySelector(`input[name="q_${i}_s_${s}"][value="true"]`);
                    let selFalse = document.querySelector(`input[name="q_${i}_s_${s}"][value="false"]`);
                    let row = card.querySelectorAll('.tf-row')[s];
                    let userAns = selTrue.checked ? true : (selFalse.checked ? false : null);
                    
                    if(userAns !== null) {
                        if(userAns === stmt.correct) {
                            qPoints += 0.25;
                            row.classList.add('opt-correct');
                        } else {
                            row.classList.add('opt-wrong');
                        }
                    }
                    let badgeClass = stmt.correct ? 'opt-correct' : 'opt-wrong';
                    row.querySelector('.tf-text').innerHTML += `<br><span class="ans-badge ${badgeClass}">ĐÁP ÁN: ${stmt.correct ? 'ĐÚNG' : 'SAI'}</span>`;
                });
                totalScore += qPoints;
            }
            else if (q.type === 'sa') {
                maxRawPoints += 1;
                let input = document.getElementById(`input_${i}`);
                let userVal = parseFloat(input.value);
                
                if (userVal === q.correct) {
                    totalScore += 1;
                    input.style.backgroundColor = "var(--success-bg)";
                    input.style.borderColor = "var(--success)";
                } else {
                    input.style.backgroundColor = "var(--danger-bg)";
                    input.style.borderColor = "var(--danger)";
                    let cSpan = document.createElement('span');
                    cSpan.innerHTML = ` <strong style="color:var(--success); font-size:1.2rem; margin-left: 15px;">Đáp án đúng: ${q.correct}</strong>`;
                    input.parentElement.appendChild(cSpan);
                }
                input.disabled = true;
                card.querySelectorAll('.stepper-btn').forEach(b => b.disabled = true);
            }

            card.querySelectorAll('input').forEach(inp => inp.disabled = true);

            let expDiv = document.getElementById(`exp-${i}`);
            // ĐÃ SỬA LỖI REGEX: Xóa các thẻ [cite: x] thay vì gây lỗi cú pháp
            let cleanExp = q.exp.replace(/\[cite:\s*\d+\]/g, '');
            expDiv.innerHTML = `<strong>Lời giải:</strong> ${cleanExp}`;
            expDiv.classList.remove('hidden');
        });

        let scale10 = ((totalScore / maxRawPoints) * 10).toFixed(1);
        
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-score').innerText = scale10;
        
        document.getElementById('review-container').innerHTML = '';
        document.getElementById('review-container').appendChild(document.getElementById('questions-container'));
        
        let history = JSON.parse(localStorage.getItem('chemHistory')) || [];
        let d = new Date();
        let dateStr = `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${d.getMinutes()}`;
        history.push({
            date: dateStr,
            testName: currentTestId === 'de1' ? 'Đề 1' : 'Đề 2',
            score: scale10
        });
        localStorage.setItem('chemHistory', JSON.stringify(history));
        
        if(isAuto) alert("Đã hết thời gian! Bài của bạn đã được tự động nộp.");
        window.scrollTo(0,0);
    }
</script>
